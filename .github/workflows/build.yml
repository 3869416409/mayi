name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v1
        with:
          android_api_level: 34
          buildozer_version: 1.6.0
          python_version: "3.11"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mayi-apk
          path: ./bin/*.apk
